# Decap CMS 설정 — /admin 관리 화면
# 저장소: Partners-In-Sports/partnersinsports-homepage (main 브랜치)

backend:
  name: github
  repo: Partners-In-Sports/partnersinsports-homepage
  branch: main
  # ── 인증 서버(OAuth) ────────────────────────────────────────────────
  # 아직 인증 서버가 없습니다. OAuth 프록시를 준비한 뒤 아래 두 줄의 주석을
  # 풀고 실제 주소를 넣어 주세요. (예: Netlify Function, Cloudflare Worker)
  # base_url: https://your-oauth-proxy.example.com
  # auth_endpoint: auth
  # ────────────────────────────────────────────────────────────────

# 편집한 내용을 바로 main 브랜치에 커밋합니다.
publish_mode: simple

# 업로드 이미지는 public/uploads 한 곳에만 저장되고,
# 사이트에서는 __BASE_PATH__ 기준 /uploads/파일명 으로 표시됩니다.
media_folder: "public/uploads"
public_folder: "/uploads"

# 파일명은 영문 소문자·숫자·하이픈만 사용합니다.
# (한글/공백/대문자 파일명은 업로드 시 하이픈 기준으로 정리됩니다.)
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# 관리 화면에서 한국어로 입력합니다.
locale: ko

collections:
  - name: "projects"
    label: "프로젝트"
    label_singular: "프로젝트"
    description: "프로젝트를 추가하면 Projects 목록 카드와 상세 페이지가 자동으로 만들어집니다."
    folder: "src/content/projects"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    sortable_fields: ["order", "title", "category"]
    view_groups:
      - label: "분야"
        field: "category"
    fields:
      - label: "프로젝트명"
        name: "title"
        widget: "string"
        hint: "카드와 상세 페이지 제목으로 표시됩니다."

      - label: "slug (주소)"
        name: "slug"
        widget: "string"
        hint: "영문 소문자와 하이픈만 사용하세요. 예: pis-swimming-2026 → /projects/pis-swimming-2026"

      - label: "분야"
        name: "category"
        widget: "select"
        options:
          - { label: "Research Projects", value: "research" }
          - { label: "Sporting Events", value: "events" }
          - { label: "Global Partnerships", value: "global" }
          - { label: "Merchandising", value: "merchandising" }

      - label: "카드에 표시할 분야명"
        name: "cardLabel"
        widget: "string"
        required: false
        hint: "비워두면 분야 이름이 그대로 사용됩니다."

      - label: "카드 종류"
        name: "cardType"
        widget: "select"
        default: "A"
        options:
          - { label: "A형 — 클릭 가능 (상세 페이지 있음)", value: "A" }
          - { label: "B형 — 로고만 표시 (상세 페이지 없음)", value: "B" }

      - label: "목록에 보일 순서"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 100
        hint: "숫자가 작을수록 목록 앞에 표시됩니다."

      - label: "카드 이미지"
        name: "cardImage"
        widget: "image"
        required: false

      - label: "카드 이미지 표시 방식"
        name: "cardImageFit"
        widget: "select"
        default: "cover"
        options:
          - { label: "채우기 (사진)", value: "cover" }
          - { label: "맞추기 (로고·엠블럼)", value: "contain" }

      - label: "카드 이미지 위치 (object-position)"
        name: "cardImagePosition"
        widget: "string"
        required: false
        default: "center top"
        hint: "예: center top, center, center 70%"

      - label: "카드 이미지 대체 텍스트"
        name: "cardImageAlt"
        widget: "string"
        required: false
        hint: "비워두면 프로젝트명이 사용됩니다."

      - label: "카드 오른쪽 위에 화살표 배지 표시"
        name: "badgeCorner"
        widget: "boolean"
        required: false
        default: false

      - label: "상세 라벨"
        name: "label"
        widget: "string"
        required: false
        default: "Research Projects · 연구 프로젝트"
        hint: "상세 페이지 제목 위에 표시되는 영문·국문 라벨입니다."

      - label: "상세 로고 이미지"
        name: "logoImage"
        widget: "image"
        required: false

      - label: "상세 로고 대체 텍스트"
        name: "logoAlt"
        widget: "string"
        required: false

      - label: "상세 포스터 이미지 (갤러리가 없을 때 사용)"
        name: "posterImage"
        widget: "image"
        required: false

      - label: "상세 포스터 대체 텍스트"
        name: "posterAlt"
        widget: "string"
        required: false

      - label: "갤러리 이미지 목록"
        name: "gallery"
        widget: "list"
        required: false
        hint: "순서를 바꾸면 상세 페이지 이미지 순서가 그대로 바뀝니다."
        fields:
          - { label: "이미지", name: "image", widget: "image" }
          - { label: "대체 텍스트", name: "alt", widget: "string", required: false }

      - label: "갤러리 썸네일 표시 (데스크톱)"
        name: "galleryThumbnails"
        widget: "boolean"
        required: false
        default: false

      - label: "개요 제목"
        name: "overviewTitle"
        widget: "string"
        default: "대회 개요"

      - label: "개요 (항목명 · 내용)"
        name: "overview"
        widget: "list"
        required: false
        summary: "{{fields.label}} — {{fields.value}}"
        fields:
          - { label: "항목명", name: "label", widget: "string" }
          - { label: "내용", name: "value", widget: "text" }

      - label: "주요 업무 제목"
        name: "tasksTitle"
        widget: "string"
        default: "주요 업무"

      - label: "주요 업무 목록"
        name: "tasks"
        widget: "list"
        required: false
        field: { label: "업무", name: "task", widget: "string" }

      - label: "문의 버튼 문구"
        name: "contactLabel"
        widget: "string"
        default: "문의하기"