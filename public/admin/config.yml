# Decap CMS 설정 — /admin 관리 화면
# 저장소: Partners-In-Sports/partnersinsports-homepage (main 브랜치)

backend:
  name: github
  repo: Partners-In-Sports/partnersinsports-homepage
  branch: main
  # ── 인증 서버(OAuth) ────────────────────────────────────────────────
  # 관리 화면 GitHub 로그인용 주소입니다. 이 두 줄은 그대로 유지해 주세요.
  base_url: https://pis-cms-auth.ceo-2cd.workers.dev
  auth_endpoint: auth
  # ────────────────────────────────────────────────────────────────

# 편집한 내용을 바로 main 브랜치에 커밋합니다.
publish_mode: simple

# 관리 화면(로그인 화면·상단 바 왼쪽)에 표시할 회사 로고입니다.
# 사이트 헤더에서 쓰는 파일(public/uploads/logo-main.svg)을 그대로 사용합니다.
# - logo.src            : 로그인 화면 로고
# - show_in_header: true: 로그인 후 관리 화면 상단 바 왼쪽 로고
logo:
  src: "/uploads/logo-main.svg"
  show_in_header: true

# 위 logo.src와 같은 파일입니다. (예전 방식 이름)
logo_url: "/uploads/logo-main.svg"

# 업로드 이미지는 public/uploads 한 곳에만 저장되고,
# 사이트에서는 __BASE_PATH__ 기준 /uploads/파일명 으로 표시됩니다.
media_folder: "public/uploads"
public_folder: "/uploads"

# 파일명은 영문 소문자·숫자·하이픈만 사용합니다.
# (한글/공백/대문자 파일명은 업로드 시 하이픈 기준으로 정리됩니다.)
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# 관리 화면에서 한국어로 입력합니다.
locale: ko

collections:
  - name: "projects"
    label: "프로젝트"
    label_singular: "프로젝트"
    description: "작성한 뒤 게시하면 홈페이지에 올라갑니다."
    folder: "src/content/projects"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{fields.slug}}"
    summary: "{{eventDate}} · {{title}}"
    sortable_fields: ["eventDate", "title", "category"]
    view_groups:
      - label: "분야"
        field: "category"
    fields:
      - label: "프로젝트명 *"
        name: "title"
        widget: "placeholder-string"
        placeholder: "예) 2026 ○○ 국제대회 운영"

      - label: "slug (주소) *"
        name: "slug"
        widget: "placeholder-string"
        placeholder: "예) 2026-korea-open"
        hint: "영문 소문자, 숫자, 하이픈(-)만 쓰세요. 게시 후에는 바꾸지 않는 것이 좋습니다."

      - label: "분야 *"
        name: "category"
        widget: "select"
        options:
          - { label: "Research Projects", value: "research" }
          - { label: "Sporting Events", value: "events" }
          - { label: "Global Partnerships", value: "global" }
          - { label: "Merchandising", value: "merchandising" }

      - label: "카드에 표시할 분야명"
        name: "cardLabel"
        widget: "placeholder-string"
        required: false
        placeholder: "예) Sporting Events · 스포츠 이벤트"

      - label: "카드 종류 *"
        name: "cardType"
        widget: "select"
        default: "A"
        hint: "A형은 클릭하면 상세 페이지가 열리고, B형은 로고만 보여 주는 카드입니다."
        options:
          - { label: "A형 — 클릭 가능 (상세 페이지 있음)", value: "A" }
          - { label: "B형 — 로고만 표시 (상세 페이지 없음)", value: "B" }

      - label: "목록에 보일 순서 *"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 100
        hint: "사업 시행일이 같을 때만 순서를 정합니다. 숫자가 작을수록 앞에 나옵니다."

      - label: "사업 시행일 *"
        name: "eventDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        required: false
        hint: "홈페이지에는 표시되지 않고 정렬에만 쓰입니다. 정확한 날짜를 모르면 그 달의 1일로 입력하세요. (새 프로젝트는 반드시 입력해 주세요. 기존 글로벌 파트너십 카드는 비워 두어도 됩니다.)"

      - label: "카드 이미지"
        name: "cardImage"
        widget: "image"
        required: false

      - label: "카드 이미지 표시 방식 *"
        name: "cardImageFit"
        widget: "select"
        default: "cover"
        options:
          - { label: "채우기 (사진)", value: "cover" }
          - { label: "맞추기 (로고·엠블럼)", value: "contain" }

      - label: "카드 이미지 위치 (object-position)"
        name: "cardImagePosition"
        widget: "placeholder-string"
        required: false
        default: "center top"
        placeholder: "예) center top · center 70%"

      - label: "카드 이미지 대체 텍스트"
        name: "cardImageAlt"
        widget: "placeholder-string"
        required: false
        placeholder: "예) 대회 공식 포스터"

      - label: "카드 오른쪽 위에 화살표 배지 표시"
        name: "badgeCorner"
        widget: "boolean"
        required: false
        default: false

      - label: "상세 라벨"
        name: "label"
        widget: "placeholder-string"
        required: false
        default: "Research Projects · 연구 프로젝트"
        placeholder: "예) Sporting Events · 스포츠 이벤트"

      - label: "상세 로고 이미지"
        name: "logoImage"
        widget: "image"
        required: false

      - label: "상세 로고 대체 텍스트"
        name: "logoAlt"
        widget: "placeholder-string"
        required: false
        placeholder: "예) ○○대회 공식 로고"

      - label: "상세 포스터 이미지 (갤러리가 없을 때 사용)"
        name: "posterImage"
        widget: "image"
        required: false

      - label: "상세 포스터 대체 텍스트"
        name: "posterAlt"
        widget: "placeholder-string"
        required: false
        placeholder: "예) 대회 포스터 이미지"

      - label: "갤러리 이미지 목록"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "이미지", name: "image", widget: "image" }
          - { label: "대체 텍스트", name: "alt", widget: "string", required: false }

      - label: "갤러리 썸네일 표시 (데스크톱)"
        name: "galleryThumbnails"
        widget: "boolean"
        required: false
        default: false

      - label: "개요 제목 *"
        name: "overviewTitle"
        widget: "string"
        default: "대회 개요"

      - label: "개요 (항목명 · 내용)"
        name: "overview"
        widget: "list"
        required: false
        summary: "{{fields.label}} — {{fields.value}}"
        fields:
          - { label: "항목명 *", name: "label", widget: "string" }
          - { label: "내용 *", name: "value", widget: "text" }

      - label: "주요 업무 제목 *"
        name: "tasksTitle"
        widget: "string"
        default: "주요 업무"

      - label: "주요 업무 목록"
        name: "tasks"
        widget: "list"
        required: false
        field: { label: "업무 *", name: "task", widget: "string" }

      - label: "문의 버튼 문구 *"
        name: "contactLabel"
        widget: "string"
        default: "문의하기"

  # ── 사이트 문구·이미지 ──────────────────────────────────────────────
  # 홈·회사소개·사업영역 페이지의 문구와 사진을 고칩니다. (프로젝트 글과 별도)
  # 칸을 비워 두면 기존 기본 문구가 그대로 나옵니다.
  - name: "site"
    label: "사이트 문구·이미지"
    label_singular: "페이지"
    description: "홈·회사소개·사업영역 페이지의 문구와 사진을 고칩니다. 게시하면 1~2분 뒤 사이트에 반영됩니다."
    files:
      - name: "home"
        label: "홈 페이지"
        file: "src/content/site/home.json"
        fields:
          - label: "첫 화면 소개 문구"
            name: "heroIntro"
            widget: "text"
            hint: "첫 화면 큰 제목 아래에 나오는 한글 소개 문장입니다."
          - label: "첫 화면 배경 사진"
            name: "heroSlides"
            widget: "list"
            summary: "{{fields.alt}}"
            hint: "순서대로 바뀌며 나옵니다. 가로로 긴 사진(권장 1920px 이상)을 쓰세요."
            fields:
              - { label: "사진", name: "image", widget: "image" }
              - { label: "사진 설명(검색·접근성용, 영문 가능)", name: "alt", widget: "string", required: false }
              - label: "사진에서 보여줄 부분"
                name: "focus"
                widget: "select"
                default: "top"
                options:
                  - { label: "위쪽", value: "top" }
                  - { label: "아래쪽", value: "bottom" }
          - label: "사업 소개 문구 (Our Work 아래 설명)"
            name: "workDescription"
            widget: "string"
          - label: "사업영역 카드 · Research Projects"
            name: "research"
            widget: "object"
            fields:
              - { label: "카드 문구 (줄바꿈 가능)", name: "text", widget: "text" }
              - { label: "카드 사진 (가로:세로 4:3 권장)", name: "image", widget: "image", required: false }
          - label: "사업영역 카드 · Sporting Events Consulting"
            name: "events"
            widget: "object"
            fields:
              - { label: "카드 문구 (줄바꿈 가능)", name: "text", widget: "text" }
              - { label: "카드 사진 (가로:세로 4:3 권장)", name: "image", widget: "image", required: false }
          - label: "사업영역 카드 · Global Partnerships"
            name: "global"
            widget: "object"
            fields:
              - { label: "카드 문구 (줄바꿈 가능)", name: "text", widget: "text" }
              - { label: "카드 사진 (가로:세로 4:3 권장)", name: "image", widget: "image", required: false }
          - label: "사업영역 카드 · Merchandising"
            name: "merchandising"
            widget: "object"
            fields:
              - { label: "카드 문구 (줄바꿈 가능)", name: "text", widget: "text" }
              - { label: "카드 사진 (가로:세로 4:3 권장)", name: "image", widget: "image", required: false }
          - { label: "About 패널 문구", name: "aboutPanelText", widget: "string" }
          - { label: "Projects 패널 문구", name: "projectsPanelText", widget: "string" }
          - { label: "문의 안내 문구 (홈 하단)", name: "contactText", widget: "text" }

      - name: "about"
        label: "회사소개 페이지"
        file: "src/content/site/about.json"
        fields:
          - label: "회사 소개 문단"
            name: "paragraphs"
            widget: "list"
            field: { label: "문단", name: "text", widget: "text" }
            hint: "문단 하나가 한 칸입니다. 순서대로 위에서 아래로 나옵니다."
          - { label: "소개 사진", name: "image", widget: "image", required: false }
          - { label: "사진 설명 (영문 가능)", name: "imageAlt", widget: "string", required: false }
          - label: "사업 영역 설명 (4개, 위에서부터 Research · Events · Global · Merchandising 순서)"
            name: "pillars"
            widget: "list"
            min: 4
            max: 4
            field: { label: "설명 (줄바꿈 가능)", name: "text", widget: "text" }
            hint: "4개 칸의 순서는 바꾸지 마세요."

      - name: "business"
        label: "사업영역 페이지"
        file: "src/content/site/business.json"
        fields:
          - label: "Research Projects 설명"
            name: "research"
            widget: "object"
            fields: [{ label: "설명 (빈 줄로 문단 나누기)", name: "text", widget: "text" }]
          - label: "Sporting Events Consulting 설명"
            name: "events"
            widget: "object"
            fields: [{ label: "설명 (빈 줄로 문단 나누기)", name: "text", widget: "text" }]
          - label: "Global Partnerships 설명"
            name: "global"
            widget: "object"
            fields: [{ label: "설명 (빈 줄로 문단 나누기)", name: "text", widget: "text" }]
          - label: "Merchandising 설명"
            name: "merchandising"
            widget: "object"
            fields: [{ label: "설명 (빈 줄로 문단 나누기)", name: "text", widget: "text" }]
          - label: "업무 방식 설명 (Discover · Analyse · Strategies · Deliver 순서)"
            name: "steps"
            widget: "list"
            min: 4
            max: 4
            field: { label: "설명", name: "text", widget: "string" }
            hint: "4개 칸의 순서는 바꾸지 마세요."

      - name: "company"
        label: "회사 정보"
        file: "src/content/site/company.json"
        fields:
          - { label: "대표자", name: "ceo", widget: "string" }
          - { label: "주소", name: "address", widget: "string" }
