<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 관리 화면은 검색에 노출되지 않습니다. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- 탭 아이콘 — 사이트와 같은 브랜드 핀휠 심볼 -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2092%2092%22%3E%3Cpolygon%20points%3D%2286.86%2072.25%2039.19%2061%2091.57%2053.15%2086.86%2072.25%22%20fill%3D%22%2300a550%22%2F%3E%3Cpolygon%20points%3D%2234.46%2091.01%2030.43%2042.19%2054.09%2089.58%2034.46%2091.01%22%20fill%3D%22%23ec1b23%22%2F%3E%3Cpolygon%20points%3D%22.43%2046.97%2045.61%2028.05%207.85%2065.19%20.43%2046.97%22%20fill%3D%22%2300adee%22%2F%3E%3Cpolygon%20points%3D%2285.22%2016.62%2068.5%206.24%2063.27%2037.56%2063.75%2038.12%2063.23%2037.84%2059.78%2058.48%2085.22%2016.62%22%20fill%3D%22%23fff100%22%2F%3E%3Cpolygon%20points%3D%2231.8%20.99%2016.76%2013.68%2063.23%2037.84%2063.27%2037.56%22%2F%3E%3Cpolygon%20points%3D%2263.27%2037.56%2063.23%2037.84%2063.75%2038.12%2063.27%2037.56%22%20fill%3D%22%23fff100%22%2F%3E%3C%2Fsvg%3E" />
    <title>파트너스인스포츠 관리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <style id="pis-admin-theme">
      /* ===================================================================
         관리 화면 테마 — 회사 사이트와 같은 폰트·색·모서리·그림자
         (Decap CMS 구조와 동작은 그대로 두고 겉모습만 맞춥니다.)
         =================================================================== */
      :root {
        --pis-ink: #221e1f;
        --pis-green: #00a550;
        --pis-green-deep: #008b43;
        --pis-green-soft: rgba(0, 165, 80, 0.08);
        --pis-canvas: #f6f4ef;
        /* 사이트 헤더와 같은 바탕(가장 밝은 배경)과 구분선 */
        --pis-header-bg: #fdfdfc;
        --pis-header-line: #f0eee8;
        --pis-surface: #ffffff;
        --pis-surface-soft: #fbfaf7;
        --pis-line: #e7e3dd;
        --pis-line-strong: #d7d2cb;
        --pis-text: #302c28;
        --pis-muted: #6d6a64;
        --pis-quiet: #8a857d;
        --pis-radius: 8px;
        --pis-shadow: 0 1px 2px rgba(34, 30, 31, 0.05);
        --pis-font: 'Inter', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR',
          sans-serif;
        --pis-font-heading: 'Archivo', 'Inter', 'Apple SD Gothic Neo', 'Malgun Gothic',
          sans-serif;
      }

      html,
      body,
      #root {
        background-color: var(--pis-canvas) !important;
      }

      body {
        color: var(--pis-ink) !important;
        font-family: var(--pis-font) !important;
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      [class$="-CollectionTopHeading"] {
        font-family: var(--pis-font-heading) !important;
      }

      button {
        cursor: pointer;
      }

      /* ── 상단 바 (사이트 헤더 기준) ────────────────────────────────
         사이트 헤더: 높이 68~76px · 밝은 뉴트럴 바탕 · 하단 얇은 구분선
         · 왼쪽 로고(높이 36~40px) · 메뉴는 작은 대문자 라벨
         ───────────────────────────────────────────────────────────── */
      [class*="AppHeader"] {
        background: var(--pis-header-bg) !important;
        box-shadow: none !important;
      }

      /* 실제 상단 바(스크립트가 표시) — 사이트 헤더와 같은 높이
         · 로고/메뉴/오른쪽 버튼을 한 줄에, 왼쪽부터 차례로 놓습니다.
         (가운데로 모이지 않도록 justify-content: flex-start) */
      .pis-cms-bar {
        display: flex !important;
        align-items: center !important;
        justify-content: flex-start !important;
        flex-wrap: nowrap !important;
        box-sizing: border-box !important;
        height: 68px !important;
        min-height: 68px !important;
        max-height: 68px !important;
        padding: 0 16px !important;
        border-bottom: 1px solid var(--pis-header-line) !important;
        overflow: visible !important;
      }

      .pis-cms-bar > * {
        align-self: center !important;
      }

      /* 로고를 감싸는 줄 — 안쪽 항목도 세로 가운데 정렬 */
      .pis-cms-row {
        display: flex !important;
        align-items: center !important;
        justify-content: flex-start !important;
        flex-wrap: nowrap !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
        list-style: none !important;
      }

      /* 로고 — 줄의 맨 앞에 고정 */
      .pis-cms-logo {
        display: flex !important;
        align-items: center !important;
        flex: 0 0 auto !important;
        margin-top: 0 !important;
        margin-bottom: 0 !important;
        margin-left: 0 !important;
        margin-right: 20px !important;
        padding-left: 0 !important;
        cursor: pointer !important;
        text-decoration: none !important;
      }

      /* 계정 프로필만 줄의 오른쪽 끝으로 보냅니다.
         미디어·빠른 추가는 콘텐츠 메뉴 옆에 그대로 붙여 둡니다. */
      .pis-cms-user {
        margin-left: auto !important;
      }

      /* 프로필 요소를 못 찾았을 때의 대비 — 줄의 마지막 항목을 오른쪽으로 */
      .pis-cms-row > *:last-child:not(.pis-cms-user) {
        margin-left: auto !important;
      }

      @media (min-width: 768px) {
        /* 상단 바 안쪽은 본문(AppMainContainer)과 같은 가운데 정렬 규칙을
           그대로 씁니다. · 본문 내용 폭: 최대 1414px · 좌우 여백: 18px
           · 로고 자리 280px + 목록 칸 682px = 962px
           → 로고 왼쪽 끝 = 컬렉션 칸 왼쪽 끝,
             프로필 오른쪽 끝 = 목록 칸 오른쪽 끝이 됩니다.
           (화면 폭이 달라져도 본문과 같은 값으로 함께 움직입니다.) */
        .pis-cms-bar {
          height: 76px !important;
          min-height: 76px !important;
          max-height: 76px !important;
          padding-left: 18px !important;
          padding-right: 18px !important;
        }

        .pis-cms-row {
          width: min(962px, 100%) !important;
          max-width: 100% !important;
          flex: 0 0 auto !important;
          margin-left: max(0px, calc((100% - 1414px) / 2)) !important;
          margin-right: 0 !important;
        }

        /* 로고 자리 280px — 크기는 그대로 두고 자리만 확보합니다. */
        .pis-cms-logo {
          flex: 0 0 280px !important;
          width: 280px !important;
          margin-right: 0 !important;
        }
      }

      /* 로고 — 모바일 36px, 데스크톱 40px · 비율 유지(늘어나지 않음) */
      .pis-cms-logo img,
      .pis-cms-logo-img {
        display: block !important;
        height: 36px !important;
        width: auto !important;
        max-width: 220px !important;
        max-height: 40px !important;
        object-fit: contain !important;
        flex: 0 0 auto !important;
      }

      @media (min-width: 768px) {
        .pis-cms-logo img,
        .pis-cms-logo-img {
          height: 40px !important;
          max-height: 40px !important;
        }
      }

      /* 기본 로고(그림 파일이 없을 때의 심볼)도 같은 높이로 */
      .pis-cms-logo svg {
        display: block !important;
        height: 36px !important;
        width: auto !important;
        max-width: 220px !important;
      }

      @media (min-width: 768px) {
        .pis-cms-logo svg {
          height: 40px !important;
        }
      }

      /* Decap 기본 규칙이 더 세게 걸려도 밀리지 않도록, 상단 바 안의 로고를
         여러 겹의 선택자로 한 번 더 지정합니다. (클래스 이름이 버전마다
         달라지므로 header 안쪽 img까지 함께 잡습니다.) */
      [class*="AppHeader"] img,
      [class*="AppHeader"] [class*="Logo"] img,
      header[class*="AppHeader"] a img,
      .pis-cms-bar a img {
        display: block !important;
        height: 36px !important;
        min-height: 36px !important;
        width: auto !important;
        min-width: 0 !important;
        max-width: 260px !important;
        max-height: none !important;
        /* Decap 기본 규칙(padding: 12px 20px / border-box)이 로고 그림을
           눌러 찌그러뜨리지 않도록 여백과 계산 방식을 되돌립니다. */
        padding: 0 !important;
        margin: 0 !important;
        box-sizing: content-box !important;
        object-fit: contain !important;
        object-position: left center !important;
      }

      @media (min-width: 768px) {
        [class*="AppHeader"] img,
        [class*="AppHeader"] [class*="Logo"] img,
        header[class*="AppHeader"] a img,
        .pis-cms-bar a img {
          height: 40px !important;
          min-height: 40px !important;
        }
      }

      /* 로고를 감싸는 상자들이 높이를 잘라내지 않도록
         (링크·li 등 어떤 단계에서도 잘리지 않게 함께 풀어 둡니다.) */
      .pis-cms-logo,
      .pis-cms-logo img,
      .pis-cms-row,
      [class*="AppHeaderLogo"],
      header[class*="AppHeader"] li,
      header[class*="AppHeader"] li > a,
      header[class*="AppHeader"] a[class*="Logo"] {
        max-height: none !important;
        overflow: visible !important;
      }

      [class*="AppHeader"] a,
      [class*="AppHeader"] button,
      [class*="AppHeader"] span,
      [class*="AppHeader"] h1,
      [class*="AppHeader"] div {
        color: var(--pis-ink) !important;
        font-family: var(--pis-font-heading) !important;
      }

      /* 메뉴 글자 — 사이트 상단 메뉴와 같은 작은 대문자 라벨 */
      [class*="AppHeader"] a {
        font-size: 12px !important;
        font-weight: 500 !important;
        letter-spacing: 0.16em !important;
        text-transform: uppercase !important;
        white-space: nowrap !important;
      }

      [class*="AppHeader"] a:hover,
      [class*="AppHeader"] button:hover {
        color: var(--pis-green) !important;
      }

      /* 오른쪽 버튼(빠른 추가 · 계정) — 사이트의 보조 버튼 모양 */
      [class*="AppHeader"] button {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 6px !important;
        height: 36px !important;
        min-width: 36px !important;
        padding: 0 12px !important;
        background: transparent !important;
        border: 1px solid var(--pis-line-strong) !important;
        border-radius: 6px !important;
        box-shadow: none !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        letter-spacing: 0.12em !important;
        text-transform: uppercase !important;
        white-space: nowrap !important;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }

      [class*="AppHeader"] button:hover {
        background: var(--pis-green-soft) !important;
        border-color: var(--pis-green) !important;
        color: var(--pis-green) !important;
      }

      [class*="AppHeader"] button svg {
        color: currentColor !important;
      }

      /* ── 왼쪽 컬렉션 메뉴 ─────────────────────────────────────────── */
      aside[class*="Sidebar"],
      [class*="SidebarContainer"] {
        background: var(--pis-surface) !important;
        border: 1px solid var(--pis-line) !important;
        border-radius: 10px !important;
        box-shadow: none !important;
      }

      [class$="-SidebarHeading"] {
        font-family: var(--pis-font-heading) !important;
        font-size: 10px !important;
        font-weight: 700 !important;
        letter-spacing: 0.18em !important;
        text-transform: uppercase !important;
        color: var(--pis-quiet) !important;
      }

      [class*="SidebarNavLink"] {
        margin: 2px 8px !important;
        padding: 9px 12px !important;
        border-left: 2px solid transparent !important;
        border-radius: 6px !important;
        font-family: var(--pis-font-heading) !important;
        font-size: 13px !important;
        font-weight: 500 !important;
        letter-spacing: 0.02em !important;
        color: var(--pis-text) !important;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      [class*="SidebarNavLink"]:hover {
        background: var(--pis-green-soft) !important;
        border-left-color: var(--pis-green) !important;
        color: var(--pis-ink) !important;
      }

      [class*="SidebarNavLink"].sidebar-active {
        background: var(--pis-green-soft) !important;
        border-left-color: var(--pis-green) !important;
        color: var(--pis-green) !important;
        font-weight: 600 !important;
      }

      [class*="SidebarNavLink"] svg {
        color: currentColor !important;
      }

      /* ── 목록 상단(제목·설명·+ 프로젝트) ───────────────────────────── */
      [class*="CollectionTopContainer"] {
        background: transparent !important;
        border: 0 !important;
        box-shadow: none !important;
      }

      [class$="-CollectionTopHeading"] {
        font-size: 22px !important;
        font-weight: 700 !important;
        letter-spacing: -0.01em !important;
        color: var(--pis-ink) !important;
      }

      [class$="-CollectionTopDescription"] {
        font-family: var(--pis-font) !important;
        font-size: 12.5px !important;
        line-height: 1.7 !important;
        color: var(--pis-muted) !important;
      }

      [class$="-CollectionTopNewButton"] {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        background: var(--pis-ink) !important;
        border: 1px solid var(--pis-ink) !important;
        border-radius: 6px !important;
        box-shadow: none !important;
        color: var(--pis-surface) !important;
        font-family: var(--pis-font-heading) !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        letter-spacing: 0.12em !important;
        text-transform: uppercase !important;
        white-space: nowrap !important;
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      [class$="-CollectionTopNewButton"]:hover {
        background: var(--pis-green) !important;
        border-color: var(--pis-green) !important;
        color: var(--pis-surface) !important;
      }

      /* ── 목록 카드 ───────────────────────────────────────────────── */
      /* 목록 보기 방식 버튼(카드/리스트) — 작은 사각 버튼으로 정리 */
      [class*="ViewControlsSection"] {
        gap: 6px !important;
      }

      [class*="ViewControlsButton"] {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 32px !important;
        height: 32px !important;
        margin: 0 !important;
        padding: 0 !important;
        background: var(--pis-surface) !important;
        border: 1px solid var(--pis-line) !important;
        border-radius: 6px !important;
        color: var(--pis-quiet) !important;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }

      [class*="ViewControlsButton"]:hover {
        border-color: var(--pis-green) !important;
        color: var(--pis-green) !important;
      }

      [class*="ViewControlsButton"] svg {
        width: 16px !important;
        height: 16px !important;
        color: currentColor !important;
      }

      [class$="-CardsGrid"] {
        margin-left: 0 !important;
        gap: 16px !important;
        align-items: stretch !important;
      }

      li[class$="-ListCard"],
      li[class$="-GridCard"] {
        background: var(--pis-surface) !important;
        border: 1px solid var(--pis-line) !important;
        border-radius: var(--pis-radius) !important;
        box-shadow: var(--pis-shadow) !important;
        margin-left: 0 !important;
        margin-bottom: 0 !important;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      li[class$="-ListCard"]:hover,
      li[class$="-GridCard"]:hover {
        border-color: var(--pis-line-strong) !important;
        box-shadow: 0 2px 10px rgba(34, 30, 31, 0.07) !important;
      }

      [class$="-ListCardLink"]:hover,
      [class$="-GridCardLink"]:hover {
        background: var(--pis-surface-soft) !important;
      }

      [class$="-ListCardTitle"],
      [class$="-CardHeading"] {
        font-family: var(--pis-font-heading) !important;
        font-size: 14px !important;
        font-weight: 600 !important;
        letter-spacing: -0.005em !important;
        color: var(--pis-ink) !important;
      }

      [class$="-CollectionLabel"] {
        font-family: var(--pis-font-heading) !important;
        font-size: 10px !important;
        font-weight: 600 !important;
        letter-spacing: 0.16em !important;
        text-transform: uppercase !important;
        color: var(--pis-quiet) !important;
      }

      /* 카드(그리드) 보기 — 사이트 프로젝트 카드와 같은 비율·모서리 */
      li[class$="-GridCard"] {
        flex: 0 0 300px !important;
        width: 300px !important;
        height: 268px !important;
        max-width: 100% !important;
        border-radius: var(--pis-radius) !important;
      }

      [class$="-CardBody"] {
        padding: 16px 18px !important;
      }

      [class$="-GridCard"] [data-testid="entry-card-image"] {
        height: 156px !important;
        border-top: 1px solid var(--pis-line) !important;
        border-bottom: 0 !important;
      }

      [data-testid="entry-card-image"] {
        border-top: 1px solid var(--pis-line);
        border-bottom: 1px solid var(--pis-line);
        background-color: var(--pis-surface-soft) !important;
      }

      /* ── 편집 화면 ───────────────────────────────────────────────── */
      [class$="-ToolbarContainer"] {
        background: var(--pis-surface) !important;
        border-bottom: 1px solid var(--pis-line) !important;
        box-shadow: none !important;
      }

      [class$="-BackCollection"],
      [class$="-BackArrow"] {
        color: var(--pis-ink) !important;
        font-family: var(--pis-font-heading) !important;
      }

      [class$="-ToolbarSectionBackLink"] {
        background: transparent !important;
        border-right-color: var(--pis-line) !important;
      }

      [class$="-ToolbarSectionBackLink"]:hover,
      [class$="-ToolbarSectionBackLink"]:focus {
        background: var(--pis-green-soft) !important;
      }

      [class*="ControlPane"],
      [class*="PreviewPane"] {
        background: var(--pis-surface) !important;
      }

      /* ── 라벨 · 설명 ─────────────────────────────────────────────── */
      [class$="-FieldLabel"] {
        font-family: var(--pis-font-heading) !important;
        font-size: 10.5px !important;
        font-weight: 600 !important;
        letter-spacing: 0.12em !important;
        text-transform: uppercase !important;
        color: var(--pis-muted) !important;
      }

      /* Decap이 필수가 아닌 칸에 자동으로 붙이는 "(선택사항)" 표시는 감춥니다.
         필수 여부 설정은 그대로 두고 화면에만 보이지 않게 합니다. */
      label > span:not([class]) {
        display: none !important;
      }

      [class$="-ControlHint"] {
        font-family: var(--pis-font) !important;
        font-size: 11.5px !important;
        line-height: 1.6 !important;
        color: var(--pis-quiet) !important;
      }

      [class$="-ControlHint"] a,
      [class*="ControlPane"] a {
        color: var(--pis-green) !important;
      }

      /* ── 입력칸 ─────────────────────────────────────────────────── */
      input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
      textarea,
      select {
        background-color: var(--pis-surface) !important;
        border: 1px solid var(--pis-line) !important;
        border-radius: 6px !important;
        box-shadow: none !important;

      [class*="SaveButton"] {

      [class*="SaveButton"][disabled] {

      [class*="DeleteButton"] {

      [class*="DeleteButton"]:hover {

      /* ── 로그인 화면 ─────────────────────────────────────────────── */

  <body>
    <!--
      Decap CMS 관리 화면.
      - 저장소: Partners-In-Sports/partnersinsports-homepage (main 브랜치)
      - 프로젝트 데이터: src/content/projects/*.json
      - 업로드 이미지: public/uploads (사이트에서는 __BASE_PATH__ + /uploads/ 경로로 사용)
      설정 파일: public/admin/config.yml

      이 파일에서 함께 등록하는 것
      1) "projects" 컬렉션 미리보기 — 실제 목록 카드(A형·B형)와 상세 페이지 모양
      2) 미리보기 전용 스타일 — 사이트와 같은 폰트·브랜드 컬러
      3) placeholder-string 위젯 — 입력칸 안에 회색 예시 문구 표시
      4) 관리 화면 테마 — 사이트와 같은 폰트·색·모서리·그림자 (겉모습만)
    -->
    <!--
      프로젝트 목록의 기본 보기를 카드(그리드)로 지정합니다.
      Decap CMS는 viewStyle을 localStorage의 "decap-cms.entries.viewStyle"에
      저장하고, 값이 없을 때만 리스트로 시작합니다.
      → 값이 아직 없을 때만 그리드로 넣어 두므로, 사용자가 직접
        리스트 보기를 고르면 그 선택이 그대로 유지됩니다.
      (CMS 스크립트가 로드되기 전에 실행되어야 합니다.)
    -->
    <script>
      (function () {
        try {
          var KEY = 'decap-cms.entries.viewStyle';
          if (!window.localStorage.getItem(KEY)) {
            window.localStorage.setItem(KEY, 'VIEW_STYLE_GRID');
          }
        } catch (error) {
          /* 저장소를 쓸 수 없는 환경에서는 CMS 기본값을 그대로 따릅니다. */
        }
      })();
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      (function () {
        var CMS = window.CMS;
        if (!CMS) return;

        var h = window.h;
        var createClass = window.createClass || window.createReactClass;
        if (!h || !createClass) return;

        /* -------------------------------------------------------------------
           1. 공통 값 — 사이트(src/content/projects/index.ts)과 같은 규칙
           ------------------------------------------------------------------- */
        var CATEGORY_LABELS = {
          research: 'Research Projects',
          events: 'Sporting Events',
          global: 'Global Partnerships',
          merchandising: 'Merchandising',
        };

        var DETAIL_LABELS = {
          research: 'Research Projects · 연구 프로젝트',
          events: 'Sporting Events · 스포츠 이벤트',
          global: 'Global Partnerships · 글로벌 파트너십',
          merchandising: 'Merchandising · 머천다이징',
        };

        function plain(value) {
          if (!value) return null;
          if (typeof value.toJS === 'function') return value.toJS();
          return value;
        }

        function getData(entry) {
          if (!entry || typeof entry.get !== 'function') return {};
          return plain(entry.get('data')) || {};
        }

        function text(value) {
          if (value === null || value === undefined) return '';
          return String(value).trim();
        }

        function assetUrl(props, path) {
          var value = text(path);
          if (!value) return '';
          try {
            var file = props.getAsset ? props.getAsset(value) : null;
            var url = file ? file.toString() : '';
            if (url) return url;
          } catch (error) {
            /* 미리보기 파일을 아직 찾지 못하면 원래 경로를 그대로 사용합니다. */
          }
          return value;
        }

        /* -------------------------------------------------------------------
           2. 프로젝트 미리보기 — 실제 ProjectCard / ProjectDetail 배치를 옮김
           ------------------------------------------------------------------- */
        var ProjectsPreview = createClass({
          render: function () {
            var props = this.props;
            var data = getData(props.entry);

            var category = text(data.category);
            var cardType = text(data.cardType) || 'A';
            var isA = cardType !== 'B';

            var title = text(data.title);
            var displayTitle = title || '프로젝트명을 입력하면 여기에 표시됩니다';
            var cardLabel = text(data.cardLabel) || CATEGORY_LABELS[category] || 'Project';
            var detailLabel = text(data.label) || DETAIL_LABELS[category] || 'Project';

            var fit = text(data.cardImageFit) === 'contain' ? 'contain' : 'cover';
            var position = text(data.cardImagePosition) || 'center top';
            var badgeCorner = Boolean(data.badgeCorner) && isA;

            var cardImage = assetUrl(props, data.cardImage);
            var cardAlt = text(data.cardImageAlt) || displayTitle;

            var media = [];
            if (cardImage) {
              media.push(
                h('img', {
                  key: 'image',
                  src: cardImage,
                  alt: cardAlt,
                  style: fit === 'cover' ? { objectPosition: position } : undefined,
                })
              );
            } else {
              media.push(h('span', { key: 'empty', className: 'pis-card__empty' }, '카드 이미지 없음'));
            }
            if (badgeCorner) {
              media.push(h('span', { key: 'badge', className: 'pis-card__badge' }, '↗'));
            }

            var card = h('div', { className: 'pis-card' }, [
              h(
                'div',
                {
                  key: 'media',
                  className:
                    fit === 'contain'
                      ? 'pis-card__media pis-card__media--logo'
                      : 'pis-card__media',
                },
                media
              ),
              h('div', { key: 'body', className: 'pis-card__body' }, [
                h('span', { key: 'cat', className: 'pis-card__cat' }, cardLabel),
                h('h3', { key: 'title', className: 'pis-card__title' }, displayTitle),
                h(
                  'div',
                  { key: 'foot', className: 'pis-card__foot' },
                  isA ? h('span', { className: 'pis-card__arrow' }, '↗') : null
                ),
              ]),
            ]);

            /* 상세 페이지 ------------------------------------------------- */
            var gallery = Array.isArray(data.gallery) ? data.gallery : [];
            var firstGalleryImage = '';
            if (gallery.length && gallery[0] && gallery[0].image) {
              firstGalleryImage = gallery[0].image;
            }
            var detailMediaRaw = text(data.posterImage) || firstGalleryImage;
            var detailMedia = assetUrl(props, detailMediaRaw);

            var overviewTitle = text(data.overviewTitle) || '대회 개요';
            var overview = Array.isArray(data.overview) ? data.overview : [];
            var rows = overview.filter(function (row) {
              return row && (text(row.label) || text(row.value));
            });

            var tasksTitle = text(data.tasksTitle) || '주요 업무';
            var tasks = (Array.isArray(data.tasks) ? data.tasks : []).filter(function (task) {
              return text(task);
            });

            var contactLabel = text(data.contactLabel) || '문의하기';

            var logoUrl = assetUrl(props, data.logoImage);
            var logoAlt = text(data.logoAlt) || displayTitle + ' 로고';

            var detail = h('section', { className: 'pis-detail' }, [
              h('div', { key: 'cap', className: 'pis-caption' }, [
                h('span', { key: 'rule' }),
                '상세 페이지',
              ]),
              h('span', { key: 'eyebrow', className: 'pis-detail__eyebrow' }, [
                h('i', { key: 'rule' }),
                h('span', { key: 'txt' }, detailLabel),
              ]),
              logoUrl
                ? h('img', { key: 'logo', className: 'pis-detail__logo', src: logoUrl, alt: logoAlt })
                : null,
              h('p', { key: 'title', className: 'pis-detail__title' }, displayTitle),
              detailMedia
                ? h(
                    'div',
                    { key: 'media', className: 'pis-detail__media' },
                    h('img', { src: detailMedia, alt: displayTitle })
                  )
                : null,
              rows.length
                ? h('div', { key: 'overview', className: 'pis-detail__block' }, [
                    h('p', { key: 'h', className: 'pis-detail__h' }, overviewTitle),
                    h(
                      'dl',
                      { key: 'dl', className: 'pis-dl' },
                      rows.map(function (row, index) {
                        return h('div', { key: 'row-' + index, className: 'pis-row' }, [
                          h('dt', { key: 'dt' }, text(row.label)),
                          h('dd', { key: 'dd' }, text(row.value)),
                        ]);
                      })
                    ),
                  ])
                : null,
              h('div', { key: 'tasks', className: 'pis-detail__block' }, [
                h('p', { key: 'h', className: 'pis-detail__h' }, tasksTitle),
                tasks.length
                  ? h(
                      'ul',
                      { key: 'ul', className: 'pis-tasks' },
                      tasks.map(function (task, index) {
                        return h('li', { key: 'task-' + index }, [
                          h('span', { key: 'dot', className: 'pis-dot' }),
                          h('span', { key: 'txt' }, text(task)),
                        ]);
                      })
                    )
                  : h('p', { key: 'empty', className: 'pis-empty' }, '업무를 입력하면 이곳에 표시됩니다.'),
              ]),
              h('span', { key: 'cta', className: 'pis-cta' }, [
                h('span', { key: 'txt' }, contactLabel),
                '→',
              ]),
            ]);

            return h('div', { className: 'pis-preview' }, [
              h('div', { key: 'card-cap', className: 'pis-caption' }, [
                h('span', { key: 'rule' }),
                isA ? '목록 카드 · A형 (클릭 가능)' : '목록 카드 · B형 (로고만 표시)',
              ]),
              card,
              isA
                ? detail
                : h(
                    'div',
                    { key: 'note', className: 'pis-note' },
                    'B형은 상세 페이지가 없는 로고 카드입니다. 상세 페이지가 필요하면 카드 종류를 A형으로 바꿔 주세요.'
                  ),
            ]);
          },
        });

        CMS.registerPreviewTemplate('projects', ProjectsPreview);

        /* -------------------------------------------------------------------
           3. 미리보기 전용 스타일 — 사이트와 같은 폰트와 브랜드 컬러
           ------------------------------------------------------------------- */
        var PREVIEW_CSS = [
          "@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');",
          '.pis-preview{font-family:Inter,sans-serif;background:#f5f3ef;color:#221e1f;padding:18px;word-break:keep-all;overflow-wrap:break-word;}',
          '.pis-preview *{box-sizing:border-box;}',
          '.pis-caption{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:Archivo,Inter,sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8a857d;}',
          '.pis-caption>span{display:block;width:18px;height:1px;background:#00a550;flex:0 0 auto;}',
          '.pis-card{max-width:360px;display:flex;flex-direction:column;background:#fff;border:1px solid #e7e3dd;border-radius:8px;overflow:hidden;}',
          '.pis-card__media{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#ecebe7;}',
          '.pis-card__media img{display:block;width:100%;height:100%;object-fit:cover;}',
          '.pis-card__media--logo{display:flex;align-items:center;justify-content:center;background:#fff;}',
          '.pis-card__media--logo img{width:auto;height:auto;max-width:70%;max-height:70%;object-fit:contain;}',
          '.pis-card__empty{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:Archivo,Inter,sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a8a29a;}',
          '.pis-card__badge{position:absolute;top:12px;right:12px;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid rgba(253,252,251,.3);border-radius:999px;background:rgba(34,30,31,.72);color:#fdfcfb;font-size:13px;line-height:1;}',
          '.pis-card__body{display:flex;flex:1;flex-direction:column;padding:16px;}',
          '.pis-card__cat{font-family:Archivo,Inter,sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6d6a64;}',
          '.pis-card__title{margin:8px 0 0;font-family:Archivo,Inter,sans-serif;font-size:16px;font-weight:700;line-height:1.35;letter-spacing:-.01em;color:#221e1f;}',
          '.pis-card__foot{display:flex;justify-content:flex-end;margin-top:auto;padding-top:18px;}',
          '.pis-card__arrow{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid #dcd8d2;border-radius:999px;color:#4b4741;font-size:13px;line-height:1;}',
          '.pis-detail{margin-top:24px;padding-top:20px;border-top:1px dashed #dcd8d2;}',
          '.pis-detail__eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:Archivo,Inter,sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#6d6a64;}',
          '.pis-detail__eyebrow i{display:block;width:20px;height:1px;background:#00a550;flex:0 0 auto;}',
          '.pis-detail__logo{display:block;margin-top:14px;max-width:140px;max-height:36px;object-fit:contain;}',
          '.pis-detail__title{margin:10px 0 0;font-family:Archivo,Inter,sans-serif;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.01em;color:#221e1f;}',
          '.pis-detail__media{margin-top:14px;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:6px;background:#ecebe7;}',
          '.pis-detail__media img{display:block;width:100%;height:100%;object-fit:cover;}',
          '.pis-detail__block{margin-top:18px;padding-top:12px;border-top:1px solid #e7e3dd;}',
          '.pis-detail__h{margin:0;font-family:Archivo,Inter,sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#6d6a64;}',
          '.pis-dl{margin:8px 0 0;}',
          '.pis-row{display:grid;grid-template-columns:104px 1fr;gap:0 12px;margin-top:8px;}',
          '.pis-row dt{font-size:12px;line-height:1.6;color:#6d6a64;}',
          '.pis-row dd{margin:0;font-size:13px;line-height:1.6;color:#302c28;}',
          '.pis-tasks{display:flex;flex-direction:column;gap:7px;margin:10px 0 0;padding:0;list-style:none;}',
          '.pis-tasks li{display:flex;gap:9px;font-size:13px;line-height:1.6;color:#302c28;}',
          '.pis-dot{flex:0 0 auto;width:5px;height:5px;margin-top:8px;border-radius:999px;background:#00a550;}',
          '.pis-empty{margin:10px 0 0;font-size:12px;line-height:1.6;color:#a8a29a;}',
          '.pis-cta{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:10px 18px;border-radius:6px;background:#221e1f;color:#fdfcfb;font-family:Archivo,Inter,sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;}',
          '.pis-note{margin-top:22px;padding:12px 14px;border:1px dashed #dcd8d2;border-radius:6px;background:#faf9f7;font-size:12px;line-height:1.7;color:#6d6a64;}',
        ].join('\n');

        CMS.registerPreviewStyle(PREVIEW_CSS, { raw: true });

        /* -------------------------------------------------------------------
           4. placeholder-string 위젯 — 입력칸 안에 회색 예시 문구를 표시합니다.
              (Decap CMS의 기본 string 위젯은 placeholder를 지원하지 않습니다.)
           ------------------------------------------------------------------- */
        var PlaceholderControl = createClass({
          handleChange: function (event) {
            this.props.onChange(event.target.value);
          },
          render: function () {
            var field = this.props.field;
            var placeholder = field && field.get ? field.get('placeholder') || '' : '';

            return h('input', {
              id: this.props.forID,
              className: this.props.classNameWrapper,
              type: 'text',
              value: this.props.value || '',
              placeholder: placeholder,
              autoComplete: 'off',
              onChange: this.handleChange,
            });
          },
        });

        var PlaceholderPreview = function (props) {
          return h('span', null, props.value || '');
        };

        CMS.registerWidget('placeholder-string', PlaceholderControl, PlaceholderPreview);
      })();
    </script>
    <script>
      /*
        Decap CMS가 필수가 아닌 칸의 라벨 뒤에 자동으로 붙이는 "(선택사항)"
        글자를 화면에서만 없앱니다. 필수 여부 설정은 그대로 유지됩니다.
        (필수 항목은 config.yml 라벨 끝의 " *"로 구분합니다.)
      */
      (function () {
        var MARKER = /^\(\s*(optional|선택사항)\s*\)$/;

        function cleanLabels() {
          var labels = document.querySelectorAll('label');
          for (var i = 0; i < labels.length; i += 1) {
            var spans = labels[i].querySelectorAll(':scope > span');
            for (var j = 0; j < spans.length; j += 1) {
              var span = spans[j];
              if (span.className) continue;
              if (MARKER.test((span.textContent || '').trim())) {
                span.parentNode.removeChild(span);
              }
            }
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', cleanLabels);
        } else {
          cleanLabels();
        }

        var queued = false;
        new MutationObserver(function () {
          if (queued) return;
          queued = true;
          window.requestAnimationFrame(function () {
            queued = false;
            cleanLabels();
          });
        }).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script>
      /*
        상단 바 구성
        - 로고·메뉴·계정 프로필을 한 줄에 놓는 배치는 CSS가 담당합니다.
          CSS는 본문(AppMainContainer)과 같은 가운데 정렬 규칙(최대 폭 1414px,
          좌우 여백 18px)을 쓰고, 로고 자리 280px 뒤에서 메뉴가 시작합니다.
        - 이 스크립트는 Decap이 다시 그려도 (1) 메뉴 줄과 프로필 요소를 다시
          찾아 클래스를 붙이고, (2) 본문의 실제 위치를 재서 그 값을 그대로
          상단 바 줄에 적용합니다. (위치를 억지로 당기는 보정은 없습니다.)
        - 로그인 화면에는 상단 바가 없으므로 아무것도 하지 않습니다.
      */
      (function () {
        var ADMIN_ROOT = (function () {
          var path = window.location.pathname || '/admin/';
          var match = path.match(/^(.*?\/admin)(\/|$)/);
          if (match) return match[1] + '/';
          return path.replace(/[^/]*$/, '');
        })();

        /* 왼쪽 칸 280 + 목록 칸 682 = 962 (본문 기준) */
        var ROW_WIDTH = 962;

        var state = { bar: null, logo: null };
        var queued = false;

        function rectOf(node) {
          if (!node || typeof node.getBoundingClientRect !== 'function') return null;
          var rect = node.getBoundingClientRect();
          if (!rect || rect.width <= 0 || rect.height <= 0) return null;
          return rect;
        }

        function px(value) {
          var number = parseFloat(value);
          return isNaN(number) ? 0 : number;
        }

        function findBar() {
          var headers = document.querySelectorAll('header[class*="AppHeader"]');
          var candidates = headers.length
            ? headers
            : document.querySelectorAll('[class*="AppHeader"]');
          for (var i = 0; i < candidates.length; i += 1) {
            var rect = rectOf(candidates[i]);
            if (!rect) continue;
            if (rect.top > 8) continue;
            if (rect.height < 40 || rect.height > 140) continue;
            return candidates[i];
          }
          return null;
        }

        function findLogo(bar) {
          /* 아바타 등 다른 그림보다 로고 파일을 먼저 찾습니다. */
          var images = bar.querySelectorAll('img');
          for (var i = 0; i < images.length; i += 1) {
            var src = images[i].getAttribute('src') || '';
            if (/logo/i.test(src) && rectOf(images[i])) return images[i];
          }
          for (var j = 0; j < images.length; j += 1) {
            var name = String(images[j].className || '');
            if (/avatar|user|profile/i.test(name)) continue;
            if (rectOf(images[j])) return images[j];
          }
          return bar.querySelector('a svg, a img') || null;
        }

        function findUser(bar, logoNode) {
          var nodes = bar.querySelectorAll('button, a, [role="button"]');
          var found = null;
          for (var i = 0; i < nodes.length; i += 1) {
            var node = nodes[i];
            if (!rectOf(node)) continue;
            if (logoNode && node.contains(logoNode)) continue;
            var avatar = node.querySelector('img');
            var isAvatar =
              avatar && avatar !== logoNode && !/logo/i.test(avatar.getAttribute('src') || '');
            if (isAvatar) {
              found = node;
              continue;
            }
            var label = [
              node.getAttribute('aria-label') || '',
              String(node.className || ''),
              node.getAttribute('title') || '',
            ].join(' ');
            if (/user|profile|account|프로필|계정/i.test(label)) found = node;
          }
          return found;
        }

        /* 로고·메뉴·프로필을 모두 담는 가장 바깥쪽 가로 줄을 찾습니다. */
        function findRow(bar, logoNode) {
          var node = logoNode;
          var row = null;
          var guard = 0;
          while (node && node !== bar && guard < 10) {
            var display = window.getComputedStyle(node).display || '';
            if (display.indexOf('flex') !== -1) row = node;
            node = node.parentElement;
            guard += 1;
          }
          return row;
        }

        function flexItemWithin(row, node) {
          var current = node;
          var guard = 0;
          while (current && current !== row && guard < 10) {
            if (current.parentElement === row) return current;
            current = current.parentElement;
            guard += 1;
          }
          return null;
        }

        function enforceLogoSize(bar, image, logo) {
          var isWide = window.matchMedia('(min-width: 768px)').matches;
          var height = isWide ? 40 : 36;

          if (image.tagName === 'IMG') {
            image.style.setProperty('height', height + 'px', 'important');
            image.style.setProperty('min-height', height + 'px', 'important');
            image.style.setProperty('width', 'auto', 'important');
            image.style.setProperty('max-width', '260px', 'important');
            image.style.setProperty('max-height', 'none', 'important');
            /* Decap 기본 규칙(padding: 12px 20px / border-box)이 나중에
               주입되어도 밀리지 않도록 요소에 직접 지정합니다. */
            image.style.setProperty('padding', '0', 'important');
            image.style.setProperty('margin', '0', 'important');
            image.style.setProperty('box-sizing', 'content-box', 'important');
            image.style.setProperty('object-fit', 'contain', 'important');
          } else {
            /* 그림 파일이 없을 때 Decap이 그리는 기본 심볼 */
            image.style.setProperty('height', height + 'px', 'important');
            image.style.setProperty('width', 'auto', 'important');
          }

          /* 로고를 감싸는 상자 중 높이를 자르는 것이 있으면 풀어 줍니다. */
          var node = image.parentElement;
          var guard = 0;
          while (node && node !== bar && guard < 6) {
            node.style.setProperty('max-height', 'none', 'important');
            node.style.setProperty('overflow', 'visible', 'important');
            node = node.parentElement;
            guard += 1;
          }
        }

        function keepInsideAdmin(anchor) {
          if (!anchor || !anchor.getAttribute) return;
          var href = anchor.getAttribute('href');
          if (!href || href === '#' || href.indexOf('javascript:') === 0) {
            anchor.setAttribute('href', ADMIN_ROOT);
            return;
          }
          try {
            var resolved = new URL(href, window.location.href);
            if (resolved.origin !== window.location.origin) return;
            if (resolved.pathname.indexOf(ADMIN_ROOT) !== 0) {
              anchor.setAttribute('href', ADMIN_ROOT);
            }
          } catch (error) {
            /* 주소를 해석할 수 없으면 Decap 기본 동작을 그대로 둡니다. */
          }
        }

        function clearInline(row) {
          var props = [
            'width',
            'flex',
            'margin-left',
            'margin-right',
            'padding-left',
            'padding-right',
          ];
          for (var i = 0; i < props.length; i += 1) {
            row.style.removeProperty(props[i]);
          }
        }

        /* 다시 그려졌을 때 이전에 붙인 표시를 먼저 지웁니다. */
        function clearMarkers() {
          var rows = document.querySelectorAll('.pis-cms-row');
          for (var i = 0; i < rows.length; i += 1) {
            clearInline(rows[i]);
            rows[i].classList.remove('pis-cms-row');
          }
          var users = document.querySelectorAll('.pis-cms-user');
          for (var j = 0; j < users.length; j += 1) users[j].classList.remove('pis-cms-user');
          var logos = document.querySelectorAll('.pis-cms-logo');
          for (var k = 0; k < logos.length; k += 1) logos[k].classList.remove('pis-cms-logo');
        }

        /* 본문(AppMainContainer)이 실제로 쓰는 위치를 그대로 읽어 옵니다. */
        function bodyMetrics(bar) {
          var main = document.querySelector('[class*="AppMainContainer"]');
          var barRect = rectOf(bar);
          var mainRect = main ? rectOf(main) : null;
          if (!barRect || !mainRect) return null;

          var style = window.getComputedStyle(main);
          var left = mainRect.left + px(style.paddingLeft) + px(style.borderLeftWidth);

          var span = 0;
          var children = main.children;
          for (var i = children.length - 1; i >= 0; i -= 1) {
            var rect = rectOf(children[i]);
            if (!rect) continue;
            span = rect.right - left;
            break;
          }

          /* 목록 칸 폭을 재지 못했거나 본문을 다 채우는 상자뿐이면
             본문 기준 기본 폭(280 + 682)을 사용합니다. */
          if (!(span > 400) || span > mainRect.width - 100) span = ROW_WIDTH;

          /* 상단 바 밖으로 나가지 않도록 한 번 더 제한합니다. */
          var room = barRect.right - 18 - left;
          if (room > 200 && span > room) span = room;

          return { left: left, span: span };
        }

        function alignRow(row, bar) {
          if (row === bar) return;

          /* 768px 미만의 모바일 동작은 그대로 둡니다. */
          if (!window.matchMedia('(min-width: 768px)').matches) {
            clearInline(row);
            return;
          }

          var metrics = bodyMetrics(bar);
          var barRect = rectOf(bar);
          if (!metrics || !barRect) return;

          var style = window.getComputedStyle(bar);
          var origin = barRect.left + px(style.borderLeftWidth) + px(style.paddingLeft);
          var offset = Math.max(0, metrics.left - origin);

          row.style.setProperty('width', metrics.span + 'px', 'important');
          row.style.setProperty('flex', '0 0 auto', 'important');
          row.style.setProperty('margin-left', offset + 'px', 'important');
          row.style.setProperty('margin-right', '0px', 'important');
          row.style.setProperty('padding-left', '0px', 'important');
          row.style.setProperty('padding-right', '0px', 'important');
        }

        function locate() {
          clearMarkers();

          var bar = findBar();
          if (!bar) return false;

          var image = findLogo(bar);
          if (!image) return false;

          var row = findRow(bar, image);
          var logoItem = row ? flexItemWithin(row, image) : null;
          var anchor = image.closest ? image.closest('a') : null;

          bar.classList.add('pis-cms-bar');

          var logo = logoItem || anchor || image;
          logo.classList.add('pis-cms-logo');
          if (image.tagName === 'IMG') image.classList.add('pis-cms-logo-img');

          if (row) {
            row.classList.add('pis-cms-row');

            /* 프로필 하나에만 margin-left:auto를 주기 위해 그 항목을 찾습니다. */
            var userNode = findUser(bar, image);
            var userItem = userNode ? flexItemWithin(row, userNode) : null;
            if (!userItem) {
              var children = row.children;
              if (children.length) userItem = children[children.length - 1];
            }
            if (userItem) userItem.classList.add('pis-cms-user');

            alignRow(row, bar);
          }

          /* 클래스 선택자가 통하지 않는 화면을 대비해, 요소에 직접 크기를
             지정합니다. (직접 지정한 값은 어떤 CSS 규칙보다 우선합니다.) */
          enforceLogoSize(bar, image, logo);

          keepInsideAdmin(anchor || image);

          state.bar = bar;
          state.logo = logo;
          return true;
        }

        function refresh() {
          try {
            locate();
          } catch (error) {
            /* 어떤 상황에서도 관리 화면 동작을 막지 않습니다. */
          }
        }

        function schedule() {
          if (queued) return;
          queued = true;
          window.requestAnimationFrame(function () {
            queued = false;
            refresh();
          });
        }

        function start() {
          try {
            refresh();
            window.setTimeout(refresh, 250);
            window.setTimeout(refresh, 900);

            new MutationObserver(schedule).observe(document.documentElement, {
              childList: true,
              subtree: true,
            });

            var resizeTimer = null;
            window.addEventListener('resize', function () {
              window.clearTimeout(resizeTimer);
              resizeTimer = window.setTimeout(refresh, 120);
            });
          } catch (error) {
            /* 화면 구조를 읽지 못해도 관리 화면은 정상 동작합니다. */
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', start);
        } else {
          start();
        }
      })();
    </script>
    <script>
      /*
        사용자 메뉴 이름 표시
        - GitHub 프로필의 이름(name)이 비어 있으면 Decap CMS가 사용자 메뉴에
          "Unknown"이라고 표시합니다. 이때 GitHub 아이디(login)로 바꿔 보여 줍니다.
        - 이름이 있으면 아무것도 하지 않습니다(그대로 유지).
        - 저장된 사용자 정보에서 login과 name 두 값만 읽습니다.
          토큰 등 다른 값은 읽지도, 쓰지도 않습니다.
        - 로그인 화면·사용자 정보 없음·요소를 찾지 못한 경우에는 조용히 넘어갑니다.
      */
      (function () {
        /* 이름이 비어 있을 때 Decap이 대신 넣는 문구들 */
        var PLACEHOLDER_LABELS = [
          'unknown',
          'unknown user',
          '알 수 없음',
          '알수없음',
          '미확인',
          '不明',
          '不明なユーザー',
          '未知',
          '未知用户',
          'inconnu',
          'desconocido',
          'desconhecido',
          'unbekannt',
          'sconosciuto',
          'onbekend',
          'nieznany',
          'неизвестно',
          'bilinmiyor',
          'tuntematon',
          'okänd',
          'ukendt',
          'ismeretlen',
          'neznámý',
          'necunoscut',
          'nežinomas',
          'nezināms',
        ];

        /* 글자가 아니라 화면 구조를 가진 요소는 건드리지 않습니다. */
        var SKIP_TAGS = {
          SCRIPT: 1,
          STYLE: 1,
          NOSCRIPT: 1,
          TITLE: 1,
          TEXTAREA: 1,
          INPUT: 1,
          OPTION: 1,
        };

        function normalize(value) {
          if (value === null || value === undefined) return '';
          return String(value).replace(/\s+/g, ' ').trim().toLowerCase();
        }

        function isPlaceholderText(value) {
          var text = normalize(value);
          if (!text) return false;
          return PLACEHOLDER_LABELS.indexOf(text) !== -1;
        }

        function readProfile() {
          /* Decap은 "decap-cms-user", 예전 Netlify CMS는 "netlify-cms-user"를 씁니다. */
          var keys = ['decap-cms-user', 'netlify-cms-user'];
          for (var i = 0; i < keys.length; i += 1) {
            var raw = null;
            try {
              raw = window.localStorage.getItem(keys[i]);
            } catch (error) {
              raw = null;
            }
            if (!raw) continue;

            var parsed = null;
            try {
              parsed = JSON.parse(raw);
            } catch (error) {
              parsed = null;
            }
            if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) continue;

            /* 일부 버전은 { user: { ... } } 형태로 한 겹 감싸 저장합니다. */
            if (
              typeof parsed.login !== 'string' &&
              typeof parsed.name !== 'string' &&
              parsed.user &&
              typeof parsed.user === 'object' &&
              !Array.isArray(parsed.user)
            ) {
              parsed = parsed.user;
            }

            /* login·name 두 값만 사용합니다. */
            var login = typeof parsed.login === 'string' ? parsed.login.trim() : '';
            var name = typeof parsed.name === 'string' ? parsed.name.trim() : '';
            if (login) return { login: login, name: name };
          }
          return null;
        }

        /* 상단 바가 있으면 로그인 화면이 아닙니다. 로그인 화면에서는 아무것도 하지 않습니다. */
        function headerRoot() {
          var header = document.querySelector('[class*="AppHeader"]');
          if (!header) return null;
          var rect = header.getBoundingClientRect();
          if (!rect || rect.width < 200) return null;
          return header;
        }

        /* 계정 메뉴는 클래스 이름을 예측할 수 없는 팝업(포털)로 그려질 수
           있습니다. 그래서 화면 구조(클래스 이름)에 기대지 않고 문서 전체에서
           해당 글자를 찾습니다. (편집기·입력칸 안의 글자는 아래에서 제외) */
        function rootsToScan() {
          return [document.body];
        }

        /* 편집기·입력칸처럼 사용자가 직접 글자를 쓰는 영역인지 확인합니다. */
        var SKIP_CLASS = /CodeMirror|cm-editor|cm-content|cm-line/;

        function isEditableContext(node) {
          var element = node.parentNode;
          var guard = 0;
          while (element && element.nodeType === 1 && guard < 40) {
            if (SKIP_TAGS[element.nodeName]) return true;
            if (element.isContentEditable) return true;
            if (SKIP_CLASS.test(String(element.className || ''))) return true;
            if (element === document.body) break;
            element = element.parentNode;
            guard += 1;
          }
          return false;
        }

        /* 텍스트 노드를 직접 바꿉니다. 아바타·아이콘 등 다른 요소는 그대로 둡니다. */
        function replaceInRoot(root, login) {
          var changed = 0;
          try {
            var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            var targets = [];
            var node = walker.nextNode();
            while (node) {
              if (!isEditableContext(node) && isPlaceholderText(node.nodeValue)) {
                targets.push(node);
              }
              node = walker.nextNode();
            }
            for (var i = 0; i < targets.length; i += 1) {
              targets[i].nodeValue = login;
              changed += 1;
            }
          } catch (error) {
            /* 구조를 읽지 못하면 그냥 넘어갑니다. */
          }
          return changed;
        }

        var observer = null;
        var observing = false;

        function apply() {
          try {
            var profile = readProfile();
            if (!profile) return;

            /* 이름이 있고, 그 이름이 "Unknown" 같은 대체 문구가 아니면
               Decap이 이미 올바른 이름을 보여 주고 있으므로 손대지 않습니다.
               이름이 비어 있거나 대체 문구면 GitHub 아이디를 씁니다. */
            if (profile.name && !isPlaceholderText(profile.name)) return;

            /* 로그인 화면에는 계정 메뉴가 없으므로 아무것도 하지 않습니다. */
            if (!headerRoot()) return;

            var roots = rootsToScan();
            if (observer && observing) {
              observer.disconnect();
              observing = false;
            }

            var changed = 0;
            for (var i = 0; i < roots.length; i += 1) {
              changed += replaceInRoot(roots[i], profile.login);
              if (changed > 8) break;
            }

            if (observer) {
              observer.observe(document.documentElement, { childList: true, subtree: true });
              observing = true;
            }
          } catch (error) {
            /* 어떤 상황에서도 관리 화면 동작을 막지 않습니다. */
          }
        }

        /* 한 번에 너무 자주 돌지 않도록 묶어서 실행합니다. */
        var queued = false;
        function schedule() {
          if (queued) return;
          queued = true;
          window.setTimeout(function () {
            queued = false;
            apply();
          }, 120);
        }

        function start() {
          apply();
          window.setTimeout(apply, 400);
          window.setTimeout(apply, 1200);

          try {
            observer = new MutationObserver(schedule);
            observer.observe(document.documentElement, { childList: true, subtree: true });
            observing = true;
          } catch (error) {
            observer = null;
            observing = false;
          }

          /* 아이콘을 눌러 메뉴가 새로 그려지는 경우를 대비해,
             클릭 직후 몇 차례 더 확인합니다. */
          document.addEventListener(
            'click',
            function () {
              schedule();
              window.setTimeout(apply, 80);
              window.setTimeout(apply, 320);
            },
            true
          );
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', start);
        } else {
          start();
        }
      })();
    </script>
  </body>
</html>
